<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event Access Pro</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>*{box-sizing:border-box}body{background:#10151f;color:#fff;font:16px system-ui;margin:0}main{max-width:480px;margin:auto;padding:24px}h1{color:#e4c58b;font-size:24px}button,label{display:block;width:100%;padding:17px;border:0;border-radius:12px;background:#e4c58b;color:#10151f;font:inherit;font-weight:bold;text-align:center;margin:12px 0;cursor:pointer}#reader{overflow:hidden;border-radius:14px}#status{padding:24px;background:#253044;border-radius:12px;overflow-wrap:anywhere}small{color:#b8c0ce}input{display:none}</style></head><body><main><small>EVENT ACCESS PRO / PRUEBA DE CÁMARA</small><h1>Control de acceso</h1><div id="reader"></div><button id="start">Activar cámara en directo</button><button id="stop">Detener cámara</button><label>Escanear con fotografía<input id="photo" type="file" accept="image/*" capture="environment"></label><div id="status" role="status">Esperando código QR</div><p><small>Modo de prueba: detecta códigos, pero no autoriza entradas ni modifica boletos.</small></p></main><script>let scanner,busy=false,last=0;const status=document.getElementById('status');function show(s){status.textContent=s}function get(){if(!scanner)scanner=new Html5Qrcode('reader');return scanner}function found(code){if(Date.now()-last<1800)return;last=Date.now();show('QR DETECTADO — lectura correcta. Validación de acceso aún no conectada.');navigator.vibrate?.(100)}async function stop(){if(scanner?.isScanning)await scanner.stop();if(scanner)scanner.clear()}document.getElementById('start').onclick=async()=>{if(busy)return;busy=true;try{await stop();await get().start({facingMode:'environment'},{fps:10,qrbox:{width:230,height:230}},found,()=>{});show('Cámara activa. Muestra un QR.')}catch(e){show('Error de cámara: '+(e.message||String(e)))}finally{busy=false}};document.getElementById('stop').onclick=async()=>{if(busy)return;busy=true;try{await stop();show('Cámara detenida')}catch(e){show(String(e))}finally{busy=false}};document.getElementById('photo').onchange=async e=>{const f=e.target.files[0];if(!f||busy)return;busy=true;try{await stop();found(await get().scanFile(f,true))}catch(err){show('No se pudo leer la foto: '+String(err))}finally{busy=false;e.target.value=''}};</script></body></html>
